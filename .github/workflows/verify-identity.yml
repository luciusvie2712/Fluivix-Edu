name: Verify implemented modules
on: [push, pull_request]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: fluivix_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: fluivixedu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluivix_ci -d fluivixedu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres_e2e:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: fluivix_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: fluivixedu_e2e_test
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U fluivix_ci -d fluivixedu_e2e_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Leonxlnx/taste-skill
          ref: 6010f91a9935f1c167dfc500fb1a475681892e6b
          path: .ci-taste
      - run: mkdir -p .agents/skills && cp -R .ci-taste/skills/taste-skill .agents/skills/design-taste-frontend
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @fluivix/server-crypto build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @fluivix/mobile test
      - run: pnpm build
      - run: pnpm openapi:generate && pnpm client:generate
      - run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://fluivix_ci:isolated-ci-only@127.0.0.1:5432/fluivixedu_test
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm test:mobile:api
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://fluivix_ci:isolated-ci-only@127.0.0.1:55433/fluivixedu_e2e_test
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm audit --audit-level=high
      - name: Rehearse isolated synthetic pilot
        run: node tooling/pilot-rehearsal.mjs
        timeout-minutes: 25
      - name: Retain sanitized pilot evidence
        run: cp .cache/pilot-rehearsal-result.json docs/release/evidence/pilot-ci-result.json
      - name: Rehearse encrypted backup and fresh restore
        run: pnpm test:backup
        timeout-minutes: 25
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - name: Retain sanitized backup evidence
        run: cp .cache/backup-rehearsal-result.json docs/release/evidence/backup-ci-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-test-reports
          path: |
            playwright-report/
            test-results/
            docs/ai/evidence/
            docs/release/evidence/
