name: fluivixedu-local
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: fluivix
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: fluivixedu
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluivix -d fluivixedu"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.6-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres-data:
