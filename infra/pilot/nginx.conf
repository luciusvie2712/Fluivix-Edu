worker_processes 1;
pid /tmp/nginx.pid;
# nginx request error context can include credentials in a query string.
# Use application fixed-code logs and external HTTP probes, not raw request logs.
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=86400" always;
    server { listen 8443 ssl; server_name localhost; location / { proxy_pass http://web:3000; } }
    server { listen 8444 ssl; server_name localhost; location / { proxy_pass http://platform:3001; } }
    server {
        listen 8445 ssl;
        server_name localhost;
        location /api/v1/ { proxy_pass http://api:4000; }
        location / { return 404; }
    }
}
